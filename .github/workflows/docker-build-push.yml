name: Build & Push Docker Image

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: quelpoke
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/test:latest

      - name: Build Docker Image on GCLOUD
        uses: thibaultforgo/docker-cloud-build@v2.0.0
        with:
          gcp-project-id: cs-poc-hpzdycpiqjyvinhrczvlwcn 
          gcp-service-account-key: ${{ secrets.GCP_SA_KEY }}
          gcp-registry-repository: student-thibault
          image-name: latest
          image-sources: quelpoke
